(async()=>{
  const k=new URLSearchParams(location.hash.slice(1)).get("k");
  if(!k||!crypto.subtle) return fail();
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(k),"PBKDF2",false,["deriveBits"]);
    const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b(D.salt),iterations:D.iter},base,512));
    const iv=b(D.iv),ct=b(D.ct),msg=new Uint8Array(iv.length+ct.length);msg.set(iv);msg.set(ct,iv.length);
    const mk=await crypto.subtle.importKey("raw",bits.slice(32),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
    if(!await crypto.subtle.verify("HMAC",mk,b(D.tag),msg)) return fail();
    const ek=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
    const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-CBC",iv},ek,ct));
    document.open();document.write(html);document.close();
  }catch(e){fail()}
